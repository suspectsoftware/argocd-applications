---
# Source: household-planner/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: planner
  labels:
    app.kubernetes.io/name: household-planner
    app.kubernetes.io/instance: planner
    app.kubernetes.io/version: "0.3.2"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: household-planner-0.3.2
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: household-planner
      app.kubernetes.io/instance: planner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: household-planner
        app.kubernetes.io/instance: planner
      annotations:
        # Roll the pods when the allowlist changes.
        checksum/config: db7da8a37563be4bffbc5a1b5d569922d2757f14ebe4b45b545bf00f9a0009bd
    spec:
      imagePullSecrets:
        - name: harbor-pull
      securityContext:
        fsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: "harbor.suspectsoftware.com/homelab/planner:0.5.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PGHOST
              value: "planner-postgres"
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: "planner"
            - name: PGDATABASE
              value: "household_planner"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: planner-secrets
                  key: postgres-password
            - name: DATABASE_SSL
              value: "disable"
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: planner-secrets
                  key: auth-secret
            - name: AUTH_GOOGLE_ID
              valueFrom:
                secretKeyRef:
                  name: planner-secrets
                  key: google-client-id
            - name: AUTH_GOOGLE_SECRET
              valueFrom:
                secretKeyRef:
                  name: planner-secrets
                  key: google-client-secret
            - name: AUTH_URL
              value: "https://thehice.dk"
            - name: AUTH_TRUST_HOST
              value: "true"
            - name: NODE_ENV
              value: production
          envFrom:
            - configMapRef:
                name: planner-config
          # Next.js writes its build cache at runtime; the rest of the
          # filesystem stays read-only.
          volumeMounts:
            - name: cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /signin
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /signin
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 192Mi
      volumes:
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}

