---
# Source: household-planner/templates/migration-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: planner-migrate
  labels:
    app.kubernetes.io/name: household-planner
    app.kubernetes.io/instance: planner
    app.kubernetes.io/version: "0.3.1"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: household-planner-0.3.1
  annotations:
    # Runs before the app rolls out, so the schema is always current.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: household-planner
        app.kubernetes.io/instance: planner
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: harbor-pull
      securityContext:
        fsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: "harbor.suspectsoftware.com/homelab/planner:0.3.1"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          command: ["node", "scripts/migrate.mjs"]
          env:
            - name: PGHOST
              value: "planner-postgres"
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: "planner"
            - name: PGDATABASE
              value: "household_planner"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: planner-secrets
                  key: postgres-password
            - name: DATABASE_SSL
              value: "disable"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi

