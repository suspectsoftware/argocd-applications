---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-default-bucket
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/instance: minio
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/instance: minio
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bucket
          image: amazon/aws-cli@sha256:7a229451596d6c6ff67bc1d9ed80582097c239b2f087e7238118242c53795b07
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              endpoint=http://minio.app-minio.svc.cluster.local:9000
              if ! aws s3api head-bucket --bucket "$BUCKET" --endpoint-url "$endpoint"; then
                aws s3api create-bucket --bucket "$BUCKET" --endpoint-url "$endpoint"
              fi
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-secrets
                  key: root-user
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secrets
                  key: root-password
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: BUCKET
              valueFrom:
                secretKeyRef:
                  name: minio-secrets
                  key: default-bucket
