---
# Source: web/templates/migration-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: web-migrate
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: web
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: harbor-pull
      containers:
        - name: migrate
          image: "harbor.suspectsoftware.com/homelab/web:0.6.0"
          command: ["node", "scripts/migrate.mjs"]
          env:
            - name: PGHOST
              value: web-postgres
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: "cotv"
            - name: PGUSER
              value: "cotv"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: web-secrets
                  key: postgres-password

