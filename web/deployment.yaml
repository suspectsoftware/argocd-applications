---
# Source: web/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: web
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
      app.kubernetes.io/instance: web
      app.kubernetes.io/managed-by: Helm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/instance: web
        app.kubernetes.io/managed-by: Helm
    spec:
      imagePullSecrets:
        - name: harbor-pull
      securityContext:
        fsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: "harbor.suspectsoftware.com/homelab/web:0.6.1"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PGHOST
              value: web-postgres
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: "cotv"
            - name: PGUSER
              value: "cotv"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: web-secrets
                  key: postgres-password
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: web-secrets
                  key: auth-secret
            - name: AUTH_GOOGLE_ID
              valueFrom:
                secretKeyRef:
                  name: web-secrets
                  key: google-client-id
            - name: AUTH_GOOGLE_SECRET
              valueFrom:
                secretKeyRef:
                  name: web-secrets
                  key: google-client-secret
            - name: AUTH_URL
              value: "https://cotv.dk"
            - name: AUTH_TRUST_HOST
              value: "true"
          envFrom:
            - configMapRef:
                name: web-config
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: images
              mountPath: /app/data
      volumes:
        - name: tmp
          emptyDir: {}
        - name: images
          persistentVolumeClaim:
            claimName: web-images

