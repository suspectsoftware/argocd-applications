---
# Source: web/templates/postgres.yaml
apiVersion: v1
kind: Service
metadata:
  name: web-postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: web
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres

---
# Source: web/templates/postgres.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web-postgres
spec:
  serviceName: web-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
      app.kubernetes.io/instance: web
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/instance: web
        app.kubernetes.io/component: postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        fsGroup: 70
      containers:
        - name: postgres
          image: postgres:18-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "cotv"
            - name: POSTGRES_USER
              value: "cotv"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: web-secrets
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "cotv", "-d", "cotv"]
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi

